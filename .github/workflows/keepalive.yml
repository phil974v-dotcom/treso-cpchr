name: Supabase keep-alive

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: sb_publishable_C0bCJdeHgp58S9MLS1wFgg_LFAjS6VM" \
              "https://thqydxlyhpyscqclmyns.supabase.co/rest/v1/parametres?select=exercice&limit=1")
            echo "Tentative $i : HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then exit 0; fi
            sleep 20
          done
          exit 1
