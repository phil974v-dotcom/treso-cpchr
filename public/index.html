<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trésorerie CPCHR — SaaS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#68707e;
    --line:#e4e6eb; --accent:#2f6f4f; --accent-light:#e8f3ec;
    --red:#b5423a; --red-light:#fbebe9; --blue:#2f5f8f; --amber:#a9761c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
  }
  header{
    background:#1f2937; color:#fff; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:18px; margin:0; font-weight:600;}
  header .sub{font-size:12.5px; color:#a7b0bf;}
  .role-badge{background:#e8f3ec; color:#2f6f4f; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600;}
  nav{
    display:flex; gap:4px; background:#fff; border-bottom:1px solid var(--line);
    padding:0 20px; position:sticky; top:0; z-index:10; overflow-x:auto;
  }
  nav button{
    border:none; background:none; padding:14px 16px; font-size:14px; cursor:pointer; color:var(--muted);
    border-bottom:2px solid transparent; font-weight:500; white-space:nowrap;
  }
  nav button.active{color:var(--accent); border-bottom-color:var(--accent);}
  main{padding:22px; max-width:1220px; margin:0 auto;}
  .view{display:none;} .view.active{display:block;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .card .label{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  .card .value{font-size:21px; font-weight:700;}
  .card .value.pos{color:var(--accent);} .card .value.neg{color:var(--red);}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;}
  .panel h2{font-size:15px; margin:0 0 14px 0;}
  .panel h3{font-size:13.5px; margin:18px 0 8px 0; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:860px){ .grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;} }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid #eef0f3;}
  tr:hover td{background:#fafbfc;}
  .amt-pos{color:var(--accent); font-weight:600;} .amt-neg{color:var(--red); font-weight:600;}
  .tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; background:#eef0f3; color:#54596b;}
  .tag-compte{background:#e9eef7; color:#2f5f8f;}
  .tag-statut-Permanent{background:#e8f3ec; color:#2f6f4f;}
  .tag-statut-Affilie{background:#f6ecd8; color:#a9761c;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  input,select,textarea{
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; background:#fff; color:var(--ink); font-family:inherit;
  }
  button.btn{
    padding:8px 14px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fff;
    font-size:13.5px; font-weight:600; cursor:pointer;
  }
  button.btn.secondary{background:#fff; color:var(--ink); border-color:var(--line);}
  button.btn.danger{background:#fff; color:var(--red); border-color:#eecfcb;}
  button.btn.small{padding:5px 10px; font-size:12.5px;}
  button.btn:hover{opacity:.88;}
  button.btn:disabled{opacity:.45; cursor:not-allowed;}
  .search{flex:1; min-width:160px;}
  .badge-ok{color:var(--accent); font-weight:600;}
  .badge-warn{color:var(--red); font-weight:600;}
  .link{color:var(--blue); cursor:pointer; font-weight:600; text-decoration:none;}
  .link:hover{text-decoration:underline;}
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(20,22,28,.45); align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{background:#fff; border-radius:12px; padding:22px; width:440px; max-width:94vw; max-height:90vh; overflow:auto; position:relative;}
  .modal.large{width:720px;}
  .modal h3{margin-top:0; font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
